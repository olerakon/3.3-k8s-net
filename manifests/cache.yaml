apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: multitool
          image: wbitt/network-multitool:latest
          env:
            - name: HTTP_PORT
              value: "8082"
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: cache-svc
  labels:
    app: cache
spec:
  selector:
    app: cache
  ports:
    - name: http
      port: 8082
      targetPort: 8082
